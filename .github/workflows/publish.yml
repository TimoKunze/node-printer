name: Publish Package to npmjs
permissions:
  contents: read
  id-token: write

on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      # Older npm 11 releases (bundled with some Node versions) wrongly treat the
      # root git devDependency "prebuild" as non-root under allow-git=root and
      # fail with EALLOWGIT. npm 11.21+ and npm 12 handle it correctly.
      - name: Upgrade npm 11
        shell: bash
        run: case "$(npm -v)" in 11.*) npm install -g "npm@^11.21.0" ;; esac
      - run: npm ci --ignore-scripts
      - run: npm publish --access public
